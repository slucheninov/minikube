# image:
  # repository: autosetup/coredns
  # Overrides the image tag whose default is the chart appVersion.
  # tag: "0.1.1"

isClusterService: false

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi


serviceType: "ClusterIP"

prometheus:
  service:
    enabled: false
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9153"

# Default zone is what Kubernetes recommends:
# https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/#coredns-configmap-options
servers:
- zones:
  - zone: coredns.ecmplb.com
  port: 53
  plugins:
  - name: log
  - name: errors
  - name: ready
  - name: cache
    parameters: 60
  - name: reload
  - name: health
    configBlock: |-
      lameduck 5s
  - name: any
  - name: etcd
    configBlock: |-
      path /skydns
      endpoint https://etcd.etcd.svc.cluster.local:2379
      tls /etc/coredns/cert/tls.crt /etc/coredns/cert/tls.key /etc/coredns/cert/ca.crt
  #   credentials root Pa55w()rd
  # - name: acl
  #   configBlock: |-
  #     allow type AXFR net *
  #     allow type IXFR net *
  # - name: transfer
  #   configBlock: |-
  #     to *

extraSecrets:
  - name: etcd-client-tls
    mountPath: /etc/coredns/cert
    defaultMode: 420
