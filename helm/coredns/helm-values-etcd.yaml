image:
  repository: autosetup/coredns
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.0.2"

isClusterService: false

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi


serviceType: "ClusterIP"

prometheus:
  service:
    enabled: false
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9153"

# Default zone is what Kubernetes recommends:
# https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/#coredns-configmap-options
servers:
- zones:
  - zone: examples.com
  port: 53
  plugins:
  - name: log
  - name: errors
  - name: ready
  - name: cache
    parameters: 10
  - name: reload
  - name: health
    configBlock: |-
      lameduck 5s
  - name: any
  - name: etcd
    configBlock: |-
      path /coredns
      endpoint http://etcd.etcd.svc.cluster.local:2379
      credentials root a55w()rd
  - name: acl
    configBlock: |-
      allow type AXFR net *
      allow type IXFR net *
  - name: transfer
    configBlock: |-
      to *
  - name: records
    configBlock: |-
      @   60  IN SOA ns1.examples.com. hostmaster.examples.com. 1697800946 7200 3600 86400 3600
