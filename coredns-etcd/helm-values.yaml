auth:
  rbac:
    enabled: false
    create: false
    allowNoneAuthentication: true
    rootPassword: Pa55w()rd
  token:
    enabled: false
  client:
    enableAuthentication: true
    useAutoTLS: false
    secureTransport: true
    existingSecret: etcd-main-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
    caFilename: ca.crt
  peer:
    enableAuthentication: true
    useAutoTLS: true
    secureTransport: true
    existingSecret: etcd-main-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
    caFilename: ca.crt
replicaCount: 3
logLevel: info

metrics:
  enabled: false
  useSeparateEndpoint: true

podLabels:
  app: coredns-etcd

commonLabels:
  "coredns-agent-auto": "enabled"
  "coredns-agent-ttl": "10"

