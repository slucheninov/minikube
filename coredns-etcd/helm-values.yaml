auth:
  rbac:
    enabled: false
    create: false
    allowNoneAuthentication: true
    rootPassword: Pa55w()rd
  client:
    enableAuthentication: true
    useAutoTLS: false
    secureTransport: true
    existingSecret: etcd-client-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
    caFilename: ca.crt
  peer:
    enableAuthentication: true
    useAutoTLS: true
    secureTransport: true
    existingSecret: etcd-peer-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
    caFilename: ca.crt
replicaCount: 3
logLevel: error

metrics:
  enabled: true

podLabels:
  app: coredns-etcd

commonLabels:
  "coredns-agent-auto": "enabled"
  "coredns-agent-ttl": "10"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
    - labelSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - coredns-etcd
      topologyKey: kubernetes.io/hostname

