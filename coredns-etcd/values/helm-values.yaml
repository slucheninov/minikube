auth:
  rbac:
    enabled: false
    create: false
    allowNoneAuthentication: true
    rootPassword: Pa55w()rd
  token:
    enabled: false
  client:
    enableAuthentication: true
    useAutoTLS: false
    secureTransport: true
    existingSecret: etcd-main-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
    caFilename: ca.crt
  peer:
    enableAuthentication: true
    useAutoTLS: true
    secureTransport: true
    existingSecret: etcd-main-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
    caFilename: ca.crt

# Image configuration - let Helm chart use default image
# The chart version 12.0.18 will automatically use the correct etcd 3.6.4 image
# Uncomment and customize only if you need a specific image version:
# image:
#   registry: docker.io
#   repository: bitnami/etcd
#   tag: 3.6.4-debian-12-r3

replicaCount: 3
logLevel: info

metrics:
  enabled: false
  useSeparateEndpoint: true

podLabels:
  app: coredns-etcd

commonLabels:
  "coredns-agent-auto": "enabled"
  "coredns-agent-ttl": "10"

# Uncomment for production use with anti-affinity
# affinity:
#   podAntiAffinity:
#     requiredDuringSchedulingIgnoredDuringExecution:
#     - labelSelector:
#         matchExpressions:
#         - key: app
#           operator: In
#           values:
#           - coredns-etcd
#       topologyKey: kubernetes.io/hostname
