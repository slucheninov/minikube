# IMPORTANT: Allow non-Bitnami images
# Required when using official CoreOS etcd images instead of Bitnami images
global:
  security:
    allowInsecureImages: true

auth:
  rbac:
    enabled: false
    create: false
    allowNoneAuthentication: true
    rootPassword: Pa55w()rd
  token:
    enabled: false
  client:
    enableAuthentication: true
    useAutoTLS: false
    secureTransport: true
    existingSecret: etcd-main-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
    caFilename: ca.crt
  peer:
    enableAuthentication: true
    useAutoTLS: true
    secureTransport: true
    existingSecret: etcd-main-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
    caFilename: ca.crt

# Image configuration - using official etcd images
# Official images from quay.io/coreos/etcd
# Note: Using non-Bitnami images may result in degraded features
image:
  registry: quay.io
  repository: coreos/etcd
  tag: v3.5.16

replicaCount: 3
logLevel: info

metrics:
  enabled: false
  useSeparateEndpoint: true

podLabels:
  app: coredns-etcd

commonLabels:
  "coredns-agent-auto": "enabled"
  "coredns-agent-ttl": "10"

