apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
  #namespace: etcd
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: etcd-ca
  #namespace: etcd
spec:
  isCA: true
  secretName: etcd-ca
  commonName: "Etcd CA"
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: etcd-cluster-issuer
  #namespace: etcd
spec:
  ca:
    secretName: etcd-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: etcd-client
  #namespace: etcd
spec:
  secretName: etcd-client-tls
  duration: 17520h # 730d
  renewBefore: 4320h # 180d
  issuerRef:
    name: etcd-cluster-issuer
    kind: Issuer
    group: cert-manager.io
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  commonName: etcd-cluster
  dnsNames:
    - "*.etcd.etcd.svc.cluster.local"
    - "*.etcd-headless.etcd.svc.cluster.local"
    - "etcd.etcd.svc.cluster.local"
    - "*.etcd.coredns.svc.cluster.local"
    - "*.etcd-headless.coredns.svc.cluster.local"
    - "etcd.coredns.svc.cluster.local"
    - "etcd.coredns-etcd.ecmplb.com"
    - "*.etcd.coredns-etcd.svc.cluster.local"
    - "*.etcd-headless.coredns-etcd.svc.cluster.local"
    - "etcd.coredns-etcd.svc.cluster.local"
    - "etcd.coredns-etcd.ecmplb.com"
    - "localhost"
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: etcd-peer
  #namespace: etcd
spec:
  secretName: etcd-peer-tls
  duration: 17520h # 730d
  renewBefore: 4320h # 180d
  issuerRef:
    name: etcd-cluster-issuer
    kind: Issuer
    group: cert-manager.io
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - server auth
    - client auth
  commonName: etcd-cluster
  dnsNames:
    - "*.etcd.etcd.svc.cluster.local"
    - "*.etcd-headless.etcd.svc.cluster.local"
    - "etcd.etcd.svc.cluster.local"
    - "*.etcd.coredns.svc.cluster.local"
    - "*.etcd-headless.coredns.svc.cluster.local"
    - "etcd.coredns.svc.cluster.local"
    - "etcd.coredns.ecmplb.com"
    - "etcd.coredns-etcd.ecmplb.com"
    - "*.etcd.coredns-etcd.svc.cluster.local"
    - "*.etcd-headless.coredns-etcd.svc.cluster.local"
    - "etcd.coredns-etcd.svc.cluster.local"
    - "etcd.coredns-etcd.ecmplb.com"
    