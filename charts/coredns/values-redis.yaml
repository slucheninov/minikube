# Fixed test credentials are intentional for this local Minikube lab.
image:
  repository: autosetup/coredns
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.0.2"

isClusterService: false

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 100m
    memory: 128Mi


serviceType: "ClusterIP"

prometheus:
  service:
    enabled: false
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9153"

# Default zone is what Kubernetes recommends:
# https://kubernetes.io/docs/tasks/administer-cluster/dns-custom-nameservers/#coredns-configmap-options
servers:
- zones:
  - zone: examples.com
  port: 53
  plugins:
  - name: log
  - name: errors
  - name: ready
  # - name: cache
  #   parameters: 10
  - name: reload
  - name: health
    configBlock: |-
      lameduck 5s
  - name: any
  - name: redis
    configBlock: |-
      address keydb.keydb.svc.cluster.local:6379
      password Pa55w()rd
      connect_timeout 100
      read_timeout 100
      ttl 10
  - name: acl
    configBlock: |-
      allow type AXFR net *
      allow type IXFR net *
  - name: transfer
    configBlock: |-
      to *
  # - name: records
  #   configBlock: |-
  #     @   60  IN SOA ns1.examples.com. hostmaster.examples.com. 1697800946 7200 3600 86400 3600
