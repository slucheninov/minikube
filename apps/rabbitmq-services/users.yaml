---
apiVersion: v1
kind: Secret
metadata:
  name: user-guest
  namespace: rabbitmq-services
type: Opaque
stringData:
  username: guest
  password: victoriabrides15672

---
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: user-guest
  namespace: rabbitmq-services
spec:
  tags:
    - administrator
  rabbitmqClusterReference:
    name: k8s-rabbitmq-services
  importCredentialsSecret:
    name: user-guest

---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: user-guest
  namespace: rabbitmq-services
spec:
  vhost: "/"
  user: "guest"
  permissions:
    write: ".*"
    configure: ".*"
    read: ".*"
  rabbitmqClusterReference:
    name: k8s-rabbitmq-services


