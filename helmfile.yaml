# Helm releases for the local Minikube lab.
#
# Always select releases by label (a bare `helmfile apply` installs everything):
#   helmfile -l name=vault apply      # install / upgrade
#   helmfile -l name=vault destroy    # uninstall
#   helmfile -l group=monitoring apply
#   helmfile list                     # show all releases
#
# Values variants are selected via env vars, e.g.:
#   COREDNS_VALUES=values-etcd.yaml helmfile -l name=coredns apply
#
# metrics-server is managed by `./minikube.sh metrics install`.

repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: coredns
    url: https://coredns.github.io/helm
  - name: enapter
    url: https://enapter.github.io/charts/
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: hashicorp
    url: https://helm.releases.hashicorp.com
  - name: jetstack
    url: https://charts.jetstack.io
  - name: opensearch
    url: https://opensearch-project.github.io/helm-charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts

helmDefaults:
  wait: true
  createNamespace: true

releases:
  # --- platform ---
  - name: cert-manager
    namespace: kube-system
    chart: jetstack/cert-manager
    version: 1.13.1
    labels: {group: platform}
    values: [charts/cert-manager/values.yaml]

  - name: argocd
    namespace: argocd
    chart: argo/argo-cd
    version: 8.0.0
    labels: {group: platform}
    values: [charts/argocd/values.yaml]

  - name: vault
    namespace: vault
    chart: hashicorp/vault
    version: 0.27.0
    labels: {group: platform}
    values: [charts/vault/values.yaml]

  - name: rabbitmq-operator
    namespace: rabbitmq-operator
    chart: bitnami/rabbitmq-cluster-operator
    version: 3.3.2
    labels: {group: platform}

  # --- dns ---
  - name: coredns
    namespace: coredns
    chart: coredns/coredns
    version: 1.28.2
    labels: {group: dns}
    values:
      - charts/coredns/{{ env "COREDNS_VALUES" | default "values.yaml" }}

  - name: external-dns
    namespace: etcd
    chart: bitnami/external-dns
    version: 6.26.5
    labels: {group: dns}
    values:
      - charts/external-dns/{{ env "EXTERNAL_DNS_VALUES" | default "values.yaml" }}

  # --- monitoring ---
  - name: prometheus
    namespace: monitoring
    chart: prometheus-community/prometheus
    version: 25.4.0
    labels: {group: monitoring}
    values: [charts/prometheus/values.yaml]

  - name: grafana
    namespace: monitoring
    chart: grafana/grafana
    version: 7.0.2
    labels: {group: monitoring}
    values: [charts/grafana/values.yaml]

  - name: kube-state-metrics
    namespace: kube-system
    chart: bitnami/kube-state-metrics
    version: 3.8.0
    labels: {group: monitoring}

  # --- data ---
  - name: keydb
    namespace: keydb
    chart: enapter/keydb
    version: 0.48.0
    labels: {group: data}
    values: [charts/keydb/values.yaml]

  - name: opensearch
    namespace: opensearch
    chart: opensearch/opensearch
    version: 2.11.0
    labels: {group: data}
    values: [charts/opensearch/values.yaml]

  # --- demo ---
  - name: nginx
    namespace: nginx
    chart: bitnami/nginx
    version: 15.3.4
    labels: {group: demo}
    values: [charts/nginx/values.yaml]

  - name: nginx2
    namespace: nginx2
    chart: bitnami/nginx
    version: 15.3.4
    labels: {group: demo}
    values: [charts/nginx2/values.yaml]
