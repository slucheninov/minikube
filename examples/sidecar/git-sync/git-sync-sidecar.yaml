apiVersion: v1
kind: Pod
metadata:
  name: git-sync-web
  labels:
    app: git-sync-demo
spec:
  volumes:
  - name: content
    emptyDir: {}

  # Git-sync sidecar
  initContainers:
  - name: git-sync
    image: registry.k8s.io/git-sync/git-sync:v4.2.1
    restartPolicy: Always
    env:
    - name: GITSYNC_REPO
      value: "https://github.com/kubernetes/website"
    - name: GITSYNC_ROOT
      value: /git
    - name: GITSYNC_DEST
      value: k8s-website
    - name: GITSYNC_PERIOD
      value: "60s"
    - name: GITSYNC_ONE_TIME
      value: "false"
    - name: GITSYNC_DEPTH
      value: "1"
    volumeMounts:
    - name: content
      mountPath: /git

  # Nginx для отображения контента
  containers:
  - name: nginx
    image: nginx:1.25-alpine
    ports:
    - containerPort: 80
    volumeMounts:
    - name: content
      mountPath: /usr/share/nginx/html
      subPath: k8s-website
    command: ["/bin/sh"]
    args:
    - -c
    - |
      cat > /etc/nginx/conf.d/default.conf <<'EOF'
      server {
          listen 80;
          location / {
              root /usr/share/nginx/html;
              autoindex on;
              autoindex_exact_size off;
          }
      }
      EOF
      nginx -g 'daemon off;'
