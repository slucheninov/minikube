---
# ConfigMap для конфигурации OpenResty (Nginx + Lua)
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  labels:
    app: nginx-app
data:
  nginx.conf: |
    events {
        worker_connections 1024;
    }
    http {
        log_format detailed '$remote_addr - $remote_user [$time_local] '
                           '"$request" $status $body_bytes_sent '
                           '"$http_referer" "$http_user_agent" '
                           'rt=$request_time uct="$upstream_connect_time" '
                           'uht="$upstream_header_time" urt="$upstream_response_time"';
        
        access_log /var/log/nginx/access.log detailed;
        error_log /var/log/nginx/error.log warn;
        
        server {
            listen 80;
            server_name _;
            
            # Health check endpoint
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }
            
            # Metrics endpoint для nginx-exporter
            location /metrics {
                access_log off;
                return 200 "nginx_up 1\n";
                add_header Content-Type text/plain;
            }
            
            # Main application
            location / {
                return 200 'Hello from Nginx Pod: $hostname\nTime: $time_local\n';
                add_header Content-Type text/plain;
                add_header X-Pod-Name $hostname;
            }
            
            # Slow endpoint - с реальной задержкой 2 секунды (Lua)
            location /slow {
                content_by_lua_block {
                    ngx.sleep(2)  -- Задержка 2 секунды
                    ngx.say("Slow response from: ", ngx.var.hostname)
                    ngx.say("Delayed for 2 seconds")
                }
            }
            
            # Random delay endpoint - случайная задержка от 1 до 5 секунд
            location /random-delay {
                content_by_lua_block {
                    math.randomseed(ngx.now())
                    local delay = math.random(1, 5)
                    ngx.sleep(delay)
                    ngx.say("Random delay: ", delay, " seconds")
                    ngx.say("Pod: ", ngx.var.hostname)
                }
            }
            
            # Load test endpoint - имитация нагрузки CPU
            location /cpu-intensive {
                content_by_lua_block {
                    -- Имитация CPU нагрузки
                    local count = 0
                    for i = 1, 10000000 do
                        count = count + 1
                    end
                    ngx.say("CPU intensive task completed")
                    ngx.say("Iterations: ", count)
                    ngx.say("Pod: ", ngx.var.hostname)
                }
            }
        }
    }

---
# Deployment с OpenResty и Logging Sidecar
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-with-sidecar
  labels:
    app: nginx-app
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nginx-app
  template:
    metadata:
      labels:
        app: nginx-app
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
    spec:
      volumes:
      - name: shared-logs
        emptyDir: {}
      - name: nginx-config
        configMap:
          name: nginx-config

      # Logging Sidecar - Native Sidecar с restartPolicy
      initContainers:
      - name: log-aggregator
        image: busybox:1.36
        restartPolicy: Always  # Делает его нативным sidecar
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        command:
        - /bin/sh
        - -c
        - |
          echo "=== Log Aggregator Started ==="
          echo "Pod: $POD_NAME"
          echo "Node: $NODE_NAME"
          echo "================================"
          
          # Waiting for log file to be created
          while [ ! -f /var/log/nginx/access.log ]; do
            echo "Waiting for access.log to be created..."
            sleep 1
          done
          
          echo "Starting to tail access.log..."
          tail -f /var/log/nginx/access.log | while read line; do
            echo "[ACCESS] [$POD_NAME] $line"
          done
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        volumeMounts:
        - name: shared-logs
          mountPath: /var/log/nginx

      # Nginx Exporter Sidecar для метрик Prometheus
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:1.1.0
        restartPolicy: Always
        ports:
        - containerPort: 9113
          name: metrics
        args:
        - -nginx.scrape-uri=http://localhost:80/metrics
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "100m"

      # Main OpenResty Container (вместо стандартного Nginx)
      containers:
      - name: nginx
        image: openresty/openresty:1.25.3.1-alpine
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
        volumeMounts:
        - name: shared-logs
          mountPath: /var/log/nginx
        - name: nginx-config
          mountPath: /usr/local/openresty/nginx/conf/nginx.conf
          subPath: nginx.conf

---
# Service для доступа к Nginx
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    app: nginx-app
spec:
  type: LoadBalancer
  selector:
    app: nginx-app
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: metrics
    port: 9113
    targetPort: 9113
    protocol: TCP
  sessionAffinity: None

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: nginx-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: nginx-with-sidecar
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max