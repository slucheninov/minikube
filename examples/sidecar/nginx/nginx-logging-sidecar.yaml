apiVersion: v1
kind: Pod
metadata:
  name: nginx-logging-sidecar
  labels:
    app: nginx-demo
spec:
  volumes:
  - name: shared-logs
    emptyDir: {}

  # Нативный sidecar для чтения логов
  initContainers:
  - name: log-reader
    image: busybox:1.36
    restartPolicy: Always
    command: 
    - /bin/sh
    - -c
    - |
      echo "Log reader started, waiting for log file..."
      # Ждем, пока файл лога будет создан nginx контейнером
      while [ ! -f /var/log/nginx/access.log ]; do
        sleep 1
      done
      echo "Log file found, starting to tail..."
      tail -f /var/log/nginx/access.log
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx

  # Основной контейнер с Nginx
  containers:
  - name: nginx
    image: nginx:1.25-alpine
    ports:
    - containerPort: 80
    volumeMounts:
    - name: shared-logs
      mountPath: /var/log/nginx
    command: ["/bin/sh"]
    args:
    - -c
    - |
      cat > /etc/nginx/nginx.conf <<'EOF'
      events {
          worker_connections 1024;
      }
      http {
          access_log /var/log/nginx/access.log;
          error_log /var/log/nginx/error.log;
          
          server {
              listen 80;
              location / {
                  return 200 'Hello from Nginx with Sidecar!\n';
                  add_header Content-Type text/plain;
              }
          }
      }
      EOF
      nginx -g 'daemon off;'
