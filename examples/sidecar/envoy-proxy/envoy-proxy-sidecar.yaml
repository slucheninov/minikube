apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
    
    static_resources:
      listeners:
      - name: listener_0
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8080
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ingress_http
              access_log:
              - name: envoy.access_loggers.stdout
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
              route_config:
                name: local_route
                virtual_hosts:
                - name: backend
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/"
                    route:
                      cluster: httpbin_service
      
      clusters:
      - name: httpbin_service
        connect_timeout: 5s
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: httpbin_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: httpbin.org
                    port_value: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: envoy-proxy-demo
  labels:
    app: envoy-demo
spec:
  volumes:
  - name: envoy-config
    configMap:
      name: envoy-config

  # Envoy proxy sidecar
  initContainers:
  - name: envoy-proxy
    image: envoyproxy/envoy:v1.29-latest
    restartPolicy: Always
    ports:
    - containerPort: 8080
      name: proxy
    - containerPort: 9901
      name: admin
    volumeMounts:
    - name: envoy-config
      mountPath: /etc/envoy
    command: ["/usr/local/bin/envoy"]
    args:
    - -c
    - /etc/envoy/envoy.yaml

  # Клиентское приложение
  containers:
  - name: client-app
    image: curlimages/curl:8.5.0
    command: ["/bin/sh"]
    args:
    - -c
    - |
      echo "Client app started. Envoy proxy is available at localhost:8080"
      echo "Admin interface at localhost:9901"
      while true; do
        echo "=== Making request through Envoy proxy ==="
        curl -s http://localhost:8080/get | head -20
        echo ""
        echo "Sleeping for 30 seconds..."
        sleep 30
      done
