---
apiVersion: rabbitmq.com/v1beta1
kind: User
metadata:
  name: user-guest
  namespace: rabbitmq-services
spec:
  tags:
    - administrator
  rabbitmqClusterReference:
    name: k8s-rabbitmq-services

---
apiVersion: rabbitmq.com/v1beta1
kind: Permission
metadata:
  name: guest
  namespace: rabbitmq-services
spec:
  vhost: "/"
  user: "guest"
  permissions:
    write: ".*"
    configure: ".*"
    read: ".*"
  rabbitmqClusterReference:
    name: k8s-rabbitmq-services

