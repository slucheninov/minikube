apiVersion: v1
kind: Namespace
metadata:
  name: rabbitmq-services
  labels:
    app: rabbitmq-services

---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: k8s-rabbitmq-services
  namespace: rabbitmq-services
  labels:
    app: k8s-rabbitmq-services
    coredns-agent-auto: "enabled"
    coredns-agent-ttl:  "10"
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  image: rabbitmq:3.12.6-management-alpine
  replicas: 3
  override:
    service:
      spec:
        ports:
          - name: http-exporter
            protocol: TCP
            port: 9419
            targetPort: 9419
    statefulSet:
      spec:
        serviceName: k8s-rabbitmq-services-nodes
        template:
          metadata:
            annotations:
              prometheus.rabbitmq.io/path: /metrics
              prometheus.rabbitmq.io/port: "9419"
              prometheus.rabbitmq.io/scrape: "true"
            labels:
              app: k8s-rabbitmq-services
          spec:
            containers:
              - name: rabbitmq
                image: rabbitmq:3.12.6-management-alpine
              - name: exporter
                image: kbudde/rabbitmq-exporter:v1.0.0-RC5
                imagePullPolicy: IfNotPresent
                env:
                  - name: RABBIT_URL
                    value: "http://localhost:15672"
                  - name: RABBIT_USER
                    value: "monitoring"
                  - name: RABBIT_PASSWORD
                    value: "HgKg4bbevbVdjT3d"
                  - name: PUBLISH_PORT
                    value: "9419"
                ports:
                  - containerPort: 9419
                    name: http-exporter
                livenessProbe:
                  httpGet:
                    path: /
                    port: http-exporter
                readinessProbe:
                  httpGet:
                    path: /
                    port: http-exporter
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: ["all"]
                  readOnlyRootFilesystem: true
                  runAsNonRoot: true
                  runAsUser: 10002
  service:
      type: ClusterIP
  rabbitmq:
    envConfig: |
      RABBITMQ_USE_LONGNAME=false
      RABBITMQ_NODENAME=rabbit@`hostname -s`
    additionalConfig: |
      cluster_partition_handling = autoheal
      collect_statistics_interval = 15000
      vm_memory_high_watermark.relative = 0.5
      cluster_formation.peer_discovery_backend = rabbit_peer_discovery_k8s
      cluster_formation.k8s.host = kubernetes.default.svc.cluster.local
      cluster_formation.k8s.address_type = hostname 
      cluster_formation.k8s.service_name = k8s-rabbitmq-services
    additionalPlugins:
      - rabbitmq_consistent_hash_exchange
      - rabbitmq_sharding
