# Bitnami etcd 9.8.1 values for release `etcd` in namespace `coredns`.
# Same as k8s/argo-apps/prod-stateful-1/etcd.yaml without resources, affinity, tolerations and storageClass
# image switched to the public bitnamilegacy mirror of the prod tag.
image:
  registry: docker.io
  repository: bitnamilegacy/etcd
  tag: 3.5.11-debian-11-r3

auth:
  rbac:
    enabled: false
    create: false
    allowNoneAuthentication: true
    rootPassword: Pa55w()rd
  token:
    enabled: false
  client:
    enableAuthentication: true
    useAutoTLS: false
    secureTransport: true
    existingSecret: etcd-main-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
    caFilename: ca.crt
  peer:
    enableAuthentication: true
    useAutoTLS: true
    secureTransport: true
    existingSecret: etcd-main-tls
    certFilename: tls.crt
    certKeyFilename: tls.key
    caFilename: ca.crt
replicaCount: 3
logLevel: info

metrics:
  enabled: true
  useSeparateEndpoint: true

podLabels:
  app: coredns-etcd

commonLabels:
  "coredns-agent-auto": "enabled"
  "coredns-agent-ttl": "10"

autoCompactionMode: "periodic"
autoCompactionRetention: "72h"

persistence:
  enabled: true
  size: 10Gi

updateStrategy:
  type: OnDelete
