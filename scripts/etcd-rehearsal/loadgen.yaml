# Rehearsal clients in namespace etcd-load (Secret etcd-client-tls comes from tls.sh).
# loadgen-svc:  one endpoint, ClusterIP etcd.coredns.svc (shared-lock-api, corenet agent-k8s).
# loadgen-pods: three per-pod endpoints (processing-core resolves a name to all pod IPs).
# toolbox:      etcdctl/etcdutl 3.7 with ETCDCTL_* set to all three members.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen-svc
  namespace: etcd-load
spec:
  replicas: 1
  selector:
    matchLabels: {app: loadgen-svc}
  template:
    metadata:
      labels: {app: loadgen-svc, role: loadgen}
    spec:
      containers:
        - name: loadgen
          image: etcd-rehearsal:dev
          imagePullPolicy: Never
          args: ["-prefix=/skydns/local/cluster/rehearsal/svc"]
          env:
            - {name: ETCD_ENDPOINTS, value: "https://etcd.coredns.svc.cluster.local:2379"}
          ports: [{name: http, containerPort: 8080}]
          volumeMounts: [{name: certs, mountPath: /etc/etcd/certs, readOnly: true}]
      volumes:
        - {name: certs, secret: {secretName: etcd-client-tls}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen-pods
  namespace: etcd-load
spec:
  replicas: 1
  selector:
    matchLabels: {app: loadgen-pods}
  template:
    metadata:
      labels: {app: loadgen-pods, role: loadgen}
    spec:
      containers:
        - name: loadgen
          image: etcd-rehearsal:dev
          imagePullPolicy: Never
          args: ["-prefix=/skydns/local/cluster/rehearsal/pods"]
          env:
            - name: ETCD_ENDPOINTS
              value: "https://etcd-0.etcd-headless.coredns.svc.cluster.local:2379,https://etcd-1.etcd-headless.coredns.svc.cluster.local:2379,https://etcd-2.etcd-headless.coredns.svc.cluster.local:2379"
          ports: [{name: http, containerPort: 8080}]
          volumeMounts: [{name: certs, mountPath: /etc/etcd/certs, readOnly: true}]
      volumes:
        - {name: certs, secret: {secretName: etcd-client-tls}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toolbox
  namespace: etcd-load
spec:
  replicas: 1
  selector:
    matchLabels: {app: toolbox}
  template:
    metadata:
      labels: {app: toolbox}
    spec:
      containers:
        - name: toolbox
          image: etcd-rehearsal:dev
          imagePullPolicy: Never
          command: ["sleep", "infinity"]
          env:
            - name: ETCDCTL_ENDPOINTS
              value: "https://etcd-0.etcd-headless.coredns.svc.cluster.local:2379,https://etcd-1.etcd-headless.coredns.svc.cluster.local:2379,https://etcd-2.etcd-headless.coredns.svc.cluster.local:2379"
            - {name: ETCDCTL_CACERT, value: /etc/etcd/certs/ca.crt}
            - {name: ETCDCTL_CERT, value: /etc/etcd/certs/tls.crt}
            - {name: ETCDCTL_KEY, value: /etc/etcd/certs/tls.key}
          volumeMounts: [{name: certs, mountPath: /etc/etcd/certs, readOnly: true}]
      volumes:
        - {name: certs, secret: {secretName: etcd-client-tls}}
