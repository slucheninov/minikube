# corenet in namespace corenet for scenario 7 (recreate etcd from scratch).
# Image: docker build -t corenet-agent:dev -f examples/docker/Dockerfile.agent . in infrastructure/corenet,
# then minikube -p <profile> image load corenet-agent:dev. Env config mirrors k8s/prod/paylnx-cde-1/corenet.
# agent-k8s publishes EndpointSlices labelled coredns-agent-auto=enabled (etcd itself and Service demo);
# Job static-records is the -agent=cli pass that writes the static records once.
apiVersion: v1
kind: ServiceAccount
metadata: {name: corenet, namespace: corenet}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: corenet-rehearsal}
rules:
  - {apiGroups: [""], resources: [services, pods, events], verbs: [get, list, watch]}
  - {apiGroups: [discovery.k8s.io], resources: [endpointslices], verbs: [get, list, watch]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: corenet-rehearsal}
subjects: [{kind: ServiceAccount, name: corenet, namespace: corenet}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: corenet-rehearsal}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: corenet-leases, namespace: corenet}
rules:
  - {apiGroups: [coordination.k8s.io], resources: [leases], verbs: [get, list, watch, create, update, delete]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: corenet-leases, namespace: corenet}
subjects: [{kind: ServiceAccount, name: corenet, namespace: corenet}]
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: corenet-leases}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: corenet-env, namespace: corenet}
data:
  ETCD_URLS: "https://etcd.coredns.svc.cluster.local:2379"
  ETCD_PATH: "/skydns"
  ETCD_CA_FILE: "/etc/tls/ca.crt"
  ETCD_CERT_FILE: "/etc/tls/tls.crt"
  ETCD_KEY_FILE: "/etc/tls/tls.key"
  COREDNS_DOMAIN: "coredns.rehearsal.local"
  COREDNS_CLUSTER: "cluster-1"
  COREDNS_TTL: "10"
  COREDNS_PRIORITY: "10"
  COREDNS_DNS_RECORDS_0_NAME: "txt0"
  COREDNS_DNS_RECORDS_0_TEXT: "update=6"
  COREDNS_DNS_RECORDS_0_TTL: "30"
  COREDNS_DNS_RECORDS_1_NAME: "master.mysql-rehearsal"
  COREDNS_DNS_RECORDS_1_HOST: "10.122.1.0"
  COREDNS_DNS_RECORDS_1_TTL: "60"
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: agent-k8s, namespace: corenet}
spec:
  replicas: 2
  selector: {matchLabels: {app: agent-k8s}}
  template:
    metadata: {labels: {app: agent-k8s}}
    spec:
      serviceAccountName: corenet
      containers:
        - name: agent
          image: corenet-agent:dev
          imagePullPolicy: Never
          env: [{name: POD_NAME, valueFrom: {fieldRef: {fieldPath: metadata.name}}}]
          envFrom: [{configMapRef: {name: corenet-env}}]
          args: [-agent=k8s, -metrics-address=:8880, -lease-lock-name=agent-k8s, -lease-lock-namespace=corenet, "-id=$(POD_NAME)"]
          volumeMounts: [{name: tls, mountPath: /etc/tls, readOnly: true}]
      volumes: [{name: tls, secret: {secretName: etcd-client-tls}}]
---
# Service published by agent-k8s (3 always-Ready pods).
apiVersion: apps/v1
kind: Deployment
metadata: {name: demo, namespace: corenet}
spec:
  replicas: 3
  selector: {matchLabels: {app: demo}}
  template:
    metadata: {labels: {app: demo}}
    spec:
      containers: [{name: pause, image: registry.k8s.io/pause:3.10}]
---
apiVersion: v1
kind: Service
metadata:
  name: demo
  namespace: corenet
  labels: {coredns-agent-auto: enabled, coredns-agent-ttl: "30"}
spec:
  selector: {app: demo}
  ports: [{port: 80}]
