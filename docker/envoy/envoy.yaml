node:
  cluster: main

static_resources:
  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: backend
                      domains:
                        - "*"
                      routes:
                        # Маршрутизация для файлов .js
                        - match:
                            safe_regex:
                              google_re2: {}
                              regex: ".*\\.(js|css)$"
                          route:
                            regex_rewrite:
                              pattern:
                                google_re2: {}
                                regex: "^/(.*)\\.(css|js)$"
                              substitution: "/storage-phoenix-web/\\1.\\2"
                            cluster: gcp-storage
                            host_rewrite_literal: storage.googleapis.com
                        # - match:
                        #     safe_regex:
                        #       google_re2: {}
                        #       regex: ".*\\.css$"
                        #   route:
                        #     cluster: phoenix-web
                        #     regex_rewrite:
                        #       pattern:
                        #         google_re2: {}
                        #         regex: "^/(.*)\\.css$"
                        #       substitution: "/storage/\\1.css"
                        #     host_rewrite_literal: storage.googleapis.com
                        - match:
                            prefix: /
                          route:
                            cluster: phoenix-web
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: gcp-storage
      connect_timeout: 0.25s
      type: STRICT_DNS
      http2_protocol_options: {}
      lb_policy: ROUND_ROBIN
      use_tcp_for_dns_lookups: true
      dns_lookup_family: V4_ONLY
      dns_resolvers:
      - socket_address:
          address: 8.8.8.8
          port_value: 53
      load_assignment:
        cluster_name: gcp-storage
        endpoints:
        - lb_endpoints:
          - endpoint:
              address:
                socket_address:
                  address: storage.googleapis.com
                  port_value: 443
      transport_socket:
        name: envoy.transport_sockets.tls
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
    - name: phoenix-web
      connect_timeout: 0.25s
      type: STRICT_DNS
      http2_protocol_options: {}
      lb_policy: ROUND_ROBIN
      use_tcp_for_dns_lookups: true
      load_assignment:
        cluster_name: phoenix-web
        endpoints:
        - lb_endpoints:
          - endpoint:
              address:
                socket_address:
                  address: nginx
                  port_value: 80

